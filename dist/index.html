<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detailed Skeleton Choreographer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main>
    <div id="viewport">
      <canvas id="stage"></canvas>
      <div id="hint">drag to orbit · scroll to zoom</div>
    </div>

    <aside id="panel">
      <h1>Skeleton Choreographer <span class="tag">MotionScript v2</span></h1>
      <p class="sub">Human Primitive skins bound to the 52-joint motion rig.</p>

      <div id="status" class="ok">initializing…</div>

      <fieldset class="profile-field">
        <legend>Body profile</legend>
        <div class="segmented">
          <button type="button" data-profile="test_male" aria-pressed="true">test_male <small>1.78 m</small></button>
          <button type="button" data-profile="test_female" aria-pressed="false">test_female <small>1.65 m</small></button>
        </div>
      </fieldset>

      <label class="field">
        <span>Motion script</span>
        <select id="scriptSelect"></select>
      </label>
      <div id="brief" class="brief">—</div>

      <div class="controls">
        <button id="play" class="primary">Play</button>
        <button id="stop">Stop</button>
        <button id="regen">New 5 Seeds</button>
        <label class="loop"><input type="checkbox" id="loop" checked /> loop</label>
      </div>

      <div class="hud">
        <div><span>beat</span><b id="beat">0</b></div>
        <div><span>section</span><b id="section">-</b></div>
        <div><span>control</span><b id="move">-</b></div>
        <div><span>height</span><b id="state">1.78 m</b></div>
        <div class="dotwrap"><span>on-beat</span><i id="beatDot"></i></div>
      </div>

      <p class="foot">Offline · skinned 52-joint rig · bounded beat-keyed motion.</p>
    </aside>
  </main>

    <!-- Classic scripts define DANCE.*; the module below supplies vendored THREE. -->
  <script src="./app.bundle.js"></script>

  <script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './vendor/jsm/loaders/GLTFLoader.js';
    window.THREE = THREE;
    window.GLTFLoader = GLTFLoader;
    window.DANCE_ASSET_ROOT = './assets/';
    window.DANCE_ASSET_VERSION = '15';
    const status = document.getElementById('status');
    const setStatus = (msg, cls) => { if (status) { status.textContent = msg; status.className = cls || ''; } };
    try { DANCE.main(); }
    catch (error) { setStatus('Boot error: ' + (error && error.message || error), 'fail'); console.error(error); }
  </script>
</body>
</html>
