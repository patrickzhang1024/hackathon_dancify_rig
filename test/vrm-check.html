<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VRM compat check</title>
  <style>
    body { margin: 0; background: #11151c; color: #bfe3ff; font: 12px/1.4 monospace; }
    #log { position: fixed; top: 8px; left: 8px; white-space: pre; z-index: 2; text-shadow: 0 1px 2px #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="log">loading…</div>
  <canvas id="c"></canvas>

  <script type="importmap">
  { "imports": { "three": "../vendor/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from '../vendor/jsm/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin } from '../vendor/three-vrm.module.js';

    const el = document.getElementById('log');
    const log = (m) => { el.textContent += '\n' + m; console.log('[vrm-check] ' + m); };

    let vrm = null;
    try {
      log('three r' + THREE.REVISION);
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x11151c);
      const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.15, 2.8);
      camera.lookAt(0, 1.0, 0);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.2));
      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(2, 4, 3);
      scene.add(dir);

      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      loader.load('../assets/vrm/character.vrm', (gltf) => {
        vrm = gltf.userData.vrm;
        if (!vrm) { log('ERROR: gltf.userData.vrm missing'); return; }
        scene.add(vrm.scene);
        vrm.scene.rotation.y = Math.PI; // face the camera

        const h = vrm.humanoid;
        const names = ['hips', 'spine', 'chest', 'neck', 'head',
          'leftUpperArm', 'leftLowerArm', 'leftHand', 'leftIndexProximal', 'leftThumbProximal',
          'rightHand', 'rightIndexProximal', 'leftUpperLeg', 'leftLowerLeg', 'leftFoot'];
        const have = names.filter((n) => !!h.getNormalizedBoneNode(n));
        log('VRM meta: ' + (vrm.meta && (vrm.meta.name || vrm.meta.title)));
        log('bones ' + have.length + '/' + names.length + ': ' + have.join(','));
        log('springBoneManager: ' + !!vrm.springBoneManager);
        // prove finger control
        const idx = h.getNormalizedBoneNode('leftIndexProximal');
        if (idx) idx.rotation.z = -1.1;
        log('OK_ALL');
      }, undefined, (err) => log('LOAD ERROR: ' + (err && err.message || err)));

      const clock = new THREE.Clock();
      function tick() {
        const dt = clock.getDelta();
        if (vrm) vrm.update(dt);
        renderer.render(scene, camera);
        requestAnimationFrame(tick);
      }
      tick();
    } catch (e) {
      log('EXCEPTION: ' + (e && e.stack || e));
    }
  </script>
</body>
</html>
